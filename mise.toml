[tools]
hk = "2.12.0"
pkl = "0.33.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
rumdl = "0.3.2"
"npm:oxfmt" = "0.77.0"
"npm:oxlint" = "1.92.0"
uv = "0.11.26"

[env]
_.path = ["{{config_root}}/bin"]

[task_config]
includes = ["tasks"]

[tasks."check:hk-base-consumer"]
description = "Validate a consumer hk.pkl that amends the local hk/hk.pkl and imports Builtins"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
root=$PWD
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
cat > hk.pkl <<PKL
amends "file://$root/hk/hk.pkl"
import "package://github.com/jdx/hk/releases/download/v2.12.0/hk@2.12.0#/Builtins.pkl"

steps {
    ["ruff"] = (Builtins.ruff) {
        prefix = List("uv", "run")
    }
}
PKL
hk validate
'''
