[tools]
hk = "2.12.0"
pkl = "0.33.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
rumdl = "0.3.2"
"npm:oxfmt" = "0.77.0"
"npm:oxlint" = "1.92.0"
uv = "0.11.26"

[env]
_.path = ["{{config_root}}/bin"]

[task_config]
includes = ["tasks"]

[tasks."check:hk-base-consumer"]
description = "Validate a consumer hk.pkl that amends the local hk/hk.pkl and imports Builtins"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
root=$PWD
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
cat > hk.pkl <<PKL
amends "file://$root/hk/hk.pkl"
import "package://github.com/jdx/hk/releases/download/v2.12.0/hk@2.12.0#/Builtins.pkl"

steps {
    ["ruff"] = (Builtins.ruff) {
        prefix = List("uv", "run")
    }
}
PKL
hk validate
'''

[tasks."test:docs-check-ref-path"]
description = "ref/path accepts untracked paths that exist on disk and still flags missing ones"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-rumdl-docs-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
mkdir -p nested/real tracked
touch nested/real/file.txt tracked/a.txt
ln -s real nested/link
echo 'nested/' > .gitignore
printf '%s\n' '# Doc' '' 'Uses `tracked/a.txt`, `nested/real/file.txt`, `nested/link/file.txt` and `nested/real/`.' > ok.md
printf '%s\n' '# Doc' '' 'Uses `nested/real/file.txt` and `tracked/gone.txt`.' > bad.md
git add .gitignore tracked ok.md bad.md
"$script" ok.md
out=$("$script" bad.md || true)
grep -q 'tracked/gone.txt' <<<"$out"
! grep -q 'nested/' <<<"$out"
'''

[tasks."test:docs-check-ref-task-monorepo"]
description = "ref/task treats //:name in a monorepo root as name and still flags undefined tasks"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-rumdl-docs-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
printf '%s\n' 'monorepo_root = true' '' '[settings]' 'experimental = true' '' > mise.toml
printf '%s\n' '[tasks.vault-links]' 'run = "true"' '[tasks."event:build"]' 'run = "true"' >> mise.toml
printf '%s\n' '# Doc' '' 'Run `mise run vault-links` and `mise run event:build`.' > ok.md
printf '%s\n' '# Doc' '' 'Run `mise run vault-links` and `mise run nope`.' > bad.md
git add mise.toml ok.md bad.md
mise trust -q
mise tasks ls --no-global --hidden --json | grep -q '"//:vault-links"'
"$script" ok.md
out=$("$script" bad.md || true)
grep -q 'mise run nope' <<<"$out"
! grep -q 'vault-links' <<<"$out"
'''

[tasks."test:docs-check-ref-task-nested"]
description = "ref/task treats //<path>:name in a nested monorepo project as name and ignores parent tasks"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-rumdl-docs-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
printf '%s\n' 'monorepo_root = true' '' '[monorepo]' 'config_roots = ["app"]' '' '[settings]' 'experimental = true' '' > mise.toml
printf '%s\n' '[tasks.parent-only]' 'run = "true"' >> mise.toml
mkdir app
cd app
git init -q
printf '%s\n' '[tasks."live:build"]' 'run = "true"' > mise.toml
printf '%s\n' '# Doc' '' 'Run `mise run live:build`.' > ok.md
printf '%s\n' '# Doc' '' 'Run `mise run live:build`, `mise run parent-only` and `mise run nope`.' > bad.md
git add mise.toml ok.md bad.md
mise trust -q ../mise.toml
mise trust -q mise.toml
mise tasks ls --no-global --hidden --json | grep -q '"//app:live:build"'
"$script" ok.md
out=$("$script" bad.md || true)
grep -q 'mise run nope' <<<"$out"
grep -q 'mise run parent-only' <<<"$out"
! grep -q 'live:build' <<<"$out"
'''
