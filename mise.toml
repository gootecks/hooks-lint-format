[tools]
hk = "2.12.0"
pkl = "0.33.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
rumdl = "0.3.2"
"npm:oxfmt" = "0.77.0"
"npm:oxlint" = "1.92.0"
uv = "0.11.26"
git-cliff = "2.14.2"

[env]
_.path = ["{{config_root}}/bin"]
GITHUB_REPOSITORY = "gootecks/hooks-lint-format"

[task_config]
includes = ["tasks"]

[tasks."check:hk-base-consumer"]
description = "Validate a consumer hk.pkl that amends the local hk/hk.pkl and imports Builtins"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
root=$PWD
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
cat > hk.pkl <<PKL
amends "file://$root/hk/hk.pkl"
import "package://github.com/jdx/hk/releases/download/v2.12.0/hk@2.12.0#/Builtins.pkl"

steps {
    ["ruff"] = (Builtins.ruff) {
        prefix = List("uv", "run")
    }
}
PKL
hk validate
'''

[tasks."test:docs-check-ref-path"]
description = "ref/path accepts untracked paths that exist on disk and still flags missing ones"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-rumdl-docs-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
mkdir -p nested/real tracked
touch nested/real/file.txt tracked/a.txt
ln -s real nested/link
echo 'nested/' > .gitignore
printf '%s\n' '# Doc' '' 'Uses `tracked/a.txt`, `nested/real/file.txt`, `nested/link/file.txt` and `nested/real/`.' > ok.md
printf '%s\n' '# Doc' '' 'Uses `nested/real/file.txt` and `tracked/gone.txt`.' > bad.md
git add .gitignore tracked ok.md bad.md
"$script" ok.md
out=$("$script" bad.md || true)
grep -q 'tracked/gone.txt' <<<"$out"
! grep -q 'nested/' <<<"$out"
'''

[tasks."test:docs-check-ref-task-monorepo"]
description = "ref/task treats //:name in a monorepo root as name and still flags undefined tasks"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-rumdl-docs-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
printf '%s\n' 'monorepo_root = true' '' '[settings]' 'experimental = true' '' > mise.toml
printf '%s\n' '[tasks.vault-links]' 'run = "true"' '[tasks."event:build"]' 'run = "true"' >> mise.toml
printf '%s\n' '# Doc' '' 'Run `mise run vault-links` and `mise run event:build`.' > ok.md
printf '%s\n' '# Doc' '' 'Run `mise run vault-links` and `mise run nope`.' > bad.md
git add mise.toml ok.md bad.md
mise trust -q
mise tasks ls --no-global --hidden --json | grep -q '"//:vault-links"'
"$script" ok.md
out=$("$script" bad.md || true)
grep -q 'mise run nope' <<<"$out"
! grep -q 'vault-links' <<<"$out"
'''

[tasks."test:docs-check-ref-task-nested"]
description = "ref/task treats //<path>:name in a nested monorepo project as name and ignores parent tasks"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-rumdl-docs-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
printf '%s\n' 'monorepo_root = true' '' '[monorepo]' 'config_roots = ["app"]' '' '[settings]' 'experimental = true' '' > mise.toml
printf '%s\n' '[tasks.parent-only]' 'run = "true"' >> mise.toml
mkdir app
cd app
git init -q
printf '%s\n' '[tasks."live:build"]' 'run = "true"' > mise.toml
printf '%s\n' '# Doc' '' 'Run `mise run live:build`.' > ok.md
printf '%s\n' '# Doc' '' 'Run `mise run live:build`, `mise run parent-only` and `mise run nope`.' > bad.md
git add mise.toml ok.md bad.md
mise trust -q ../mise.toml
mise trust -q mise.toml
mise tasks ls --no-global --hidden --json | grep -q '"//app:live:build"'
"$script" ok.md
out=$("$script" bad.md || true)
grep -q 'mise run nope' <<<"$out"
grep -q 'mise run parent-only' <<<"$out"
! grep -q 'live:build' <<<"$out"
'''

[tasks."test:docs-check-ref-task-global"]
description = "ref/task accepts the kit's documented maintainer global tasks and still flags other undefined tasks"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-rumdl-docs-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
printf '%s\n' '[tasks.local-build]' 'run = "true"' > mise.toml
printf '%s\n' '# Doc' '' 'Run `mise run repo-adopt`, `mise run repo-init`, `mise run docs-drift`, `mise run unslop`, `mise run tsrs:install` and `mise run local-build`.' > ok.md
printf '%s\n' '# Doc' '' 'Run `mise run repo-adopt` and `mise run nope`.' > bad.md
git add mise.toml ok.md bad.md
mise trust -q
"$script" ok.md
out=$("$script" bad.md || true)
grep -q 'mise run nope' <<<"$out"
! grep -q 'repo-adopt' <<<"$out"
'''

[tasks."test:hk-rumdl-step-both-checks"]
description = "The hk rumdl step reports docs check findings when rumdl also has findings"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
root=$PWD
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
printf 'amends "file://%s/hk/hk.pkl"\n' "$root" > hk.pkl
printf '%s\n' '[tasks.real]' 'run = "true"' > mise.toml
printf '%s\n' '# Doc' '' 'Run `mise run nope`.' '' '#Bad heading' > mixed.md
git add hk.pkl mise.toml mixed.md
mise trust -q
out=$(hk check --step rumdl mixed.md 2>&1 || true)
grep -q 'MD018' <<<"$out"
grep -q 'ref/task' <<<"$out"
'''

[tasks."test:nlpm-check"]
description = "hlf-nlpm-check fails on name mismatch, R05 and R51 hits, reports R01 as advisory, and exits 0 on a clean repository"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
script=$PWD/bin/hlf-nlpm-check
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
git init -q
mkdir -p .claude skills/good skills/bad skills/long vocab
printf '%s\n' '---' 'score_threshold: 80' 'rule_overrides:' '  R51:' '    enabled: true' '    vocabulary_skill: vocab' '---' > .claude/nlpm.local.md
printf '%s\n' 'scopes:' '  - id: internal' '    paths:' '      - skills/' 'verbs:' '  internal:' '    - canonical: check' '      deprecated: [lint]' > vocab/registry.yaml
printf '%s\n' '---' 'name: good' 'description: Use when checking the fixture.' '---' '# Good' 'Run the check.' > skills/good/SKILL.md
git add .claude vocab skills/good
"$script"
printf '%s\n' '---' 'name: wrong' 'description: Use when testing.' '---' '# Bad' 'Handle some cases and lint the files.' '```' 'some lint in a fence' '```' > skills/bad/SKILL.md
{ printf '%s\n' '---' 'name: long' 'description: Use when testing.' '---'; seq 1 501; } > skills/long/SKILL.md
git add skills
status=0
out=$("$script") || status=$?
[ "$status" -eq 1 ]
grep -q '^skills/bad/SKILL.md:1: name ' <<<"$out"
grep -q '^skills/bad/SKILL.md:6: R01 advisory: ' <<<"$out"
grep -q '^skills/bad/SKILL.md:6: R51 ' <<<"$out"
grep -q '^skills/long/SKILL.md:5: R05 ' <<<"$out"
[ "$(grep -c ' R01 ' <<<"$out")" -eq 1 ]
! grep -q 'skills/good' <<<"$out"
git rm -q -f --cached skills/long/SKILL.md
sed -i.bak 's/^name: wrong/name: bad/; s/ and lint the files//' skills/bad/SKILL.md
rm skills/bad/SKILL.md.bak
git add skills/bad
out=$("$script")
grep -q 'R01 advisory' <<<"$out"
cd "$tmp"
rm -rf nouns
mkdir nouns
cd nouns
git init -q
mkdir -p .claude skills/n docs vocab
printf '%s\n' '---' 'rule_overrides:' '  R51:' '    enabled: true' '    vocabulary_skill: vocab' '---' > .claude/nlpm.local.md
printf '%s\n' 'scopes:' '  - id: internal' '    paths:' '      - skills/' '      - docs/' 'verbs:' '  internal: []' 'nouns:' '  core:' '    - canonical: widget' '      deprecated: [gadget]' > vocab/registry.yaml
printf '%s\n' '---' 'name: n' 'description: Use when testing nouns.' '---' '# N' 'Build the gadget.' > skills/n/SKILL.md
printf '%s\n' '# Doc' 'Some gadget notes.' > docs/x.md
git add .claude vocab skills docs
status=0
out=$("$script") || status=$?
[ "$status" -eq 1 ]
grep -q '^skills/n/SKILL.md:6: R51 ' <<<"$out"
grep -q '^docs/x.md:2: R51 ' <<<"$out"
! grep -q '^docs/x.md.* R01 ' <<<"$out"
cd "$tmp"
rm -rf exempt
mkdir exempt
cd exempt
git init -q
mkdir -p .claude skills/n vocab
printf '%s\n' '---' 'rule_overrides:' '  R51:' '    enabled: true' '    vocabulary_skill: vocab/' '---' > .claude/nlpm.local.md
printf '%s\n' 'scopes:' '  - id: internal' '    paths:' '      - skills/' '      - vocab/' 'verbs:' '  internal:' '    - name: legacy' '      deprecated: [old]' '    - canonical: build' '      deprecated: [make]' 'nouns:' '  core:' '    - canonical: widget' '      deprecated: [gadget]' > vocab/registry.yaml
printf '%s\n' '---' 'name: vocab' 'description: Use when naming terms.' '---' '# Vocab' 'The deprecated term gadget and make are listed here.' > vocab/SKILL.md
printf '%s\n' '---' 'name: n' 'description: Use when testing exemption.' '---' '# N' 'Build the widget.' > skills/n/SKILL.md
git add .claude vocab skills
"$script"
printf '%s\n' '---' 'name: n' 'description: Use when testing exemption.' '---' '# N' 'Build the gadget and make it.' > skills/n/SKILL.md
git add skills
status=0
out=$("$script") || status=$?
[ "$status" -eq 1 ]
grep -q '^skills/n/SKILL.md:6: R51 .*gadget' <<<"$out"
grep -q '^skills/n/SKILL.md:6: R51 .*make' <<<"$out"
! grep -q '^vocab/' <<<"$out"
'''

[tasks."verify:rumdl-gate"]
description = "Run after changing the hk rumdl step or bin/hlf-rumdl-fix: check every tool outcome and agent flag against the gate's promises; --mutants proves the check can fail"
dir = "{{config_root}}"
run = ".agents/skills/prove-rumdl-gate/scripts/check_rumdl_gate.py"

[tasks."check:doc-versions"]
description = "Fail when a doc, template or .cz.toml names a kit version other than the one in hk/PklProject"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -euo pipefail
expected=$(sed -n 's/^    version = "\([^"]*\)"$/\1/p' hk/PklProject)
[ -n "$expected" ] || { echo "no version in hk/PklProject" >&2; exit 2; }
num='[0-9]+\.[0-9]+\.[0-9]+'
pattern="hk-base@$num|releases/download/v$num/hk-base|hooks-lint-format-scripts-$num|ref=v$num"
pattern="$pattern|tag (\`|<code>)v$num|hooks-lint-format\" = \{ version = \"$num"
bad=0
while IFS=: read -r file line match; do
    found=$(grep -oE "$num" <<<"$match" | head -n 1)
    if [ "$found" != "$expected" ]; then
        echo "$file:$line: names kit version $found, hk/PklProject has $expected" >&2
        bad=1
    fi
done < <(git grep -nEo "$pattern" -- . ':!CHANGELOG.md' ':!plans')
cz=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' .cz.toml)
if [ "$cz" != "$expected" ]; then
    echo ".cz.toml: version $cz, hk/PklProject has $expected" >&2
    bad=1
fi
exit $bad
'''
