[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "0.1.6"
version_scheme = "semver2"
major_version_zero = true
tag_format = "v$version"
pre_bump_hooks = [
  "git-cliff --unreleased --tag \"$CZ_PRE_NEW_TAG_VERSION\" --prepend CHANGELOG.md",
  "git add CHANGELOG.md",
]
bump_message = "chore(release): v$new_version"
version_files = [
  "hk/PklProject:^    version =",
  "mise/mise.toml:hooks-lint-format",
  "README.md:release tag|hk-base@|hooks-lint-format-scripts-|ref=v",
  "hk/README.md:hk-base@",
  "mise/README.md:ref=v",
  "skills/hooks-lint-format/SKILL.md:tag .v[0-9]|hk-base@|ref=v",
  "hooks-lint-format.html:tag <code>v|ref=v",
]
