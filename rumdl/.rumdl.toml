# Shared rumdl config: Prettier-compatible formatting (oxfmt owns it) + Google-style structure.
[global]
extend-enable = ["MD060"]
line_length = 120

[MD003]
style = "atx"

[MD004]
style = "consistent"

[MD007]
indent = 2

[MD009]
strict = true

# oxfmt does not wrap prose, so line length is not enforced.
[MD013]
enabled = false

[MD029]
style = "one_or_ordered"

# oxfmt decides per item whether a list is loose; a mixed list is valid output.
[MD076]
enabled = false

[MD046]
style = "fenced"

[MD049]
style = "underscore"

[MD050]
style = "asterisk"

[MD060]
enabled = true
style = "aligned"
