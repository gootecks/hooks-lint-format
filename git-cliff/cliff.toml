# git-cliff config from gootecks/hooks-lint-format/git-cliff. Copy unchanged; see git-cliff/README.md.
[changelog]
body = """
{%- set slug = get_env(name="GITHUB_REPOSITORY", default="") -%}
{%- if slug -%}
{%- set repo = "https://github.com/" ~ slug -%}
{%- else -%}
{%- set repo = "" -%}
{%- endif -%}
{% if version -%}
## {% if repo %}[{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}){% else %}{{ version | trim_start_matches(pat="v") }}{% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}💥 **breaking:** {% endif %}{% if repo %}{{ commit.message | upper_first | replace_regex(from="\\(#([0-9]+)\\)", to="([#$1](" ~ repo ~ "/pull/$1))") }}{% else %}{{ commit.message | upper_first }}{% endif %}
{%- if commit.body and commit.body | trim %}

{{ commit.body | trim | indent(prefix="  ", first=true, blank=false) }}
{% endif %}
{%- if commit.breaking and commit.breaking_description != commit.message %}

{% set breaking = "💥 " ~ commit.breaking_description | trim -%}
{{ breaking | indent(prefix="  ", first=true, blank=false) }}
{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }, { pattern = '\n*$', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
commit_preprocessors = [
  { pattern = '(?m)^(Closes|Fixes|Resolves|Refs|Co-authored-by|Signed-off-by):.*$', replace = "" },
  { pattern = '(?m)^(Closes|Fixes|Resolves|Refs) #[0-9]+.*$', replace = "" },
  { pattern = '(?m)^\* ', replace = "- " },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡️ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactors" },
  { message = "^docs", group = "<!-- 4 -->📝 Docs" },
  { message = "^test", group = "<!-- 5 -->✅ Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->📦️ Build and CI" },
  { message = "^style", group = "<!-- 7 -->💄 Style" },
  { message = "^chore", group = "<!-- 8 -->🔨 Chores" },
  { message = "^revert", group = "<!-- 9 -->⏪️ Reverts" },
]
