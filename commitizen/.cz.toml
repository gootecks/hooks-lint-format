# Commitizen config from gootecks/hooks-lint-format/commitizen. Copies add repo-specific version_files.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "npm"
version_scheme = "semver2"
tag_format = "v$version"
pre_bump_hooks = [
  "git-cliff --unreleased --tag \"$CZ_PRE_NEW_TAG_VERSION\" --prepend CHANGELOG.md",
  "git add CHANGELOG.md",
]
bump_message = "chore(release): v$new_version"
