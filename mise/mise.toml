# Consumer template from gootecks/hooks-lint-format/mise. Merge into the repo's mise.toml.
[tools]
hk = "2.12.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
rumdl = "0.3.2"
"npm:oxfmt" = "0.77.0"
"npm:oxlint" = "1.92.0"
uv = "0.11.26"
git-cliff = "2.14.2"
swiftformat = "0.64.7"
swiftlint = "0.65.1"
"github:gootecks/hooks-lint-format" = { version = "0.4.0", asset_pattern = "hooks-lint-format-scripts-*.tar.gz", bin_path = "bin" }

[task_config]
includes = ["git::https://github.com/gootecks/hooks-lint-format.git//tasks?ref=v0.4.0"]

[settings]
experimental = true
