# Canonical tool pins from gootecks/hooks-lint-format/mise. Merge into the repo's mise.toml.
[tools]
hk = "2.12.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
rumdl = "0.3.2"
"npm:oxfmt" = "0.77.0"
"npm:oxlint" = "1.92.0"

[env]
OXLINT_TSGOLINT_PATH = "{{env.HOME}}/.local/bin/tsrs-lint"

[tasks."tsrs:install"]
description = "Build tsrs and tsrs-lint from a local oxc-project/tsrs checkout into ~/.local/bin (TSRS_DIR, default ../../tsrs)"
run = [
  "cargo install --locked --path ${TSRS_DIR:-../../tsrs}/crates/tsrs_cli --root ~/.local",
  "cargo install --locked --path ${TSRS_DIR:-../../tsrs}/crates/tsrs_lint --root ~/.local",
  "~/.local/bin/tsrs --version",
]

[tasks.pre-commit]
description = "Run the hk pre-commit hooks"
run = "hk run pre-commit"

[tasks."release:preview"]
description = "Print the next version and its changelog section (commitizen dry run)"
run = "uvx --from commitizen==4.19.3 cz bump --dry-run --changelog-to-stdout"
