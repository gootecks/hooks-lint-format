# Release workflow from gootecks/hooks-lint-format/github. Copies add a build step and release assets; change runs-on for macOS builds.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.26'
          enable-cache: false

      - name: Find the next version
        id: next
        run: |
          code=0
          version=$(uvx --from commitizen==4.19.3 cz bump --get-next --yes) || code=$?
          if [ "$code" -eq 21 ]; then
            echo "No feat, fix or breaking commit since the last tag; nothing to release."
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump version and changelog
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx git-cliff@2.14.2 --unreleased --tag "v$VERSION" --strip all > "$RUNNER_TEMP/notes.md"
          uvx --from commitizen==4.19.3 --with git-cliff==2.14.2 cz bump --yes

      - name: Push the bump commit and tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: git push --atomic "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:main "v$VERSION"

      - name: Create the GitHub Release
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
